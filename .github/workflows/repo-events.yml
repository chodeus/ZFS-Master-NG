# Discord notifications for issue, PR, release and discussion events, via the chodeus-ops reusable.

name: Repo events

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  release:
    types: [published]
  discussion:
    types: [created]

jobs:
  notify:
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/repo-events.yml@1ff57bdeb4e0ae53ea92fe9d9d3b0b0f1fd9a0be # main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
