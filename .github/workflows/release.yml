name: Release

# Pushes touching plugin files on main/beta refresh that channel's release PR; merging it cuts the release.
# Needs the RELEASE_TOKEN secret. Mechanics: chodeus-ops unraid-plugin-release.yml.

on:
  push:
    branches: [main, beta]
    paths:
      - 'zfs.master/**'
      - 'pkg_build.sh'
      - 'zfs.master.plg'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = decide from the pushed commit; pr = refresh the release PR; release = cut a release from this branch'
        type: choice
        options: [auto, pr, release]
        default: auto
      dry_run:
        description: 'Run everything except pushes, tags and the GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plg-release
  cancel-in-progress: false

jobs:
  release:
    # What the called job asks for; GitHub checks it against this grant when the run starts.
    permissions:
      contents: read
      actions: write
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-release.yml@bd052317750d1e3a8de3f2767f1f73eaa20a83a5 # main
    with:
      plg_file: zfs.master.plg
      stable_branch: main
      beta_branch: beta
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
