name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 'Branch the code is headed for, when dispatched on a PR branch'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Manifest, frontend, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Validate plugin manifest (XML)
        run: xmllint --noout zfs.master.plg

      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: chodeus/chodeus-ops
          ref: f2a43b46d158b76831c8e8e63126b22baef761bb # main
          path: .ops
          sparse-checkout: scripts

      # Add --verify-asset once the first release exists on this repo.
      - name: Verify changelog and manifest agree
        env:
          BRANCH: ${{ inputs.base || github.base_ref || github.ref_name }}
        run: |
          channel=stable
          [ "$BRANCH" != beta ] || channel=beta
          python3 .ops/scripts/plg_release.py check \
            --changelog CHANGELOG.md --plg zfs.master.plg \
            --channel "$channel" --branch "$BRANCH"

      - name: Plugin function checker tests
        run: php .github/scripts/check-plugin-functions.test.php

      - name: Every plugin function that is called is defined
        run: php .github/scripts/check-plugin-functions.php zfs.master

      - name: Frontend and package tests
        run: |
          node tests/frontend_startup_test.cjs
          node tests/frontend_rows_test.cjs
          node tests/frontend_toggle_test.cjs
          node tests/frontend_impact_test.cjs
          node tests/frontend_inventory_failure_test.cjs
          node tests/package_test.cjs
          node tests/dead_code_test.cjs

      - name: Bundled library in a real DOM
        working-directory: tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node sweetalert_dom_test.cjs

      - name: Bundled libraries match vendor.json
        run: |
          python3 tests/vendor_test.py
          python3 .github/scripts/vendor.py check

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These follow the PHP Unraid ships, not PHP releases: 7.4 = before 6.12, 8.2 = 6.12, 8.4 = current 7.x
        php: ['7.4', '8.2', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint and backend tests
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: docker run --rm --privileged -v "$PWD:/repo" -w /repo "php:${PHP_VERSION}-cli" sh tests/ci_php.sh

  unraid:
    name: Unraid ${{ matrix.unraid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {unraid: '6.9.2', php: '7.4'}
          - {unraid: '6.11.5', php: '7.4'}
          - {unraid: '6.12.15', php: '8.2'}
          - {unraid: '7.2.0', php: '8.3'}
          # renovate: newest Unraid
          - {unraid: '7.3.4', php: '8.4'}
          # Pre-release under test; drop once Renovate moves the entry above to a stable 7.4.
          - {unraid: '7.4.0-rc.2.3', php: '8.4'}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout the Unraid webGUI at this version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: unraid/webgui
          ref: ${{ matrix.unraid }}
          path: .webgui

      - name: Dialogs in a real browser with this version's themes
        run: node tests/sweetalert_render_test.cjs .webgui

      - name: Page dialogs on this version's jQuery
        working-directory: tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node page_dialog_test.cjs ../.webgui

      - name: Installer, CSRF, backend and pages on real webGUI code
        env:
          PHP_VERSION: ${{ matrix.php }}
          UNRAID_VERSION: ${{ matrix.unraid }}
        run: docker run --rm -v "$PWD:/repo" -w /repo "php:${PHP_VERSION}-cli" bash tests/unraid_compat_test.sh .webgui "$UNRAID_VERSION"

  # The one check branch rules require; the matrix names change with each Unraid release.
  gate:
    name: Lint + build
    needs: [validate, php, unraid]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write   # a dispatched run's checks never reach the PR, but a commit status does
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DISPATCHED_FOR_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.base != '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=success
          for result in $RESULTS; do [ "$result" = success ] || state=failure; done
          if [ "$DISPATCHED_FOR_PR" = true ]; then
            gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='Lint + build' -f target_url="$RUN_URL" -f description="CI dispatched for this PR: $state" >/dev/null
          fi
          echo "Jobs: $RESULTS"
          [ "$state" = success ]

  notify-failure:
    needs: [validate, php, unraid]
    if: failure() && github.event_name != 'pull_request' && !inputs.base
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@f2a43b46d158b76831c8e8e63126b22baef761bb # main
    with:
      event_type: build
      status: failure
      title: "❌ CI failed: ${{ github.ref_name }}"
      description: Validation failed; see the run.
      commit_sha: ${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
