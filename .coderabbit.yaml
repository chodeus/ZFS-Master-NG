# CodeRabbit config: ZFS Master NG (Unraid plugin; a root PHP backend runs zfs/zpool, rsync and rm on user storage)
language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_reviewers: false
  in_progress_fortune: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^beta$"
  path_filters:
    - "!zfs.master/assets/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.txz"
    - "!**/*.png"
    - "!dist/**"
  path_instructions:
    - path: "zfs.master/**/*.{php,page}"
      instructions: |
        Shipped PHP runs as root inside Unraid's webGUI. Floor is Unraid 6.9.2 (PHP 7.4; ZFS from a third-party plugin before 6.12) and it must also work on current 7.x (PHP 8.4, OpenZFS 2.4).
        - PHP 7.4 syntax and functions only: flag str_contains, str_starts_with, str_ends_with, match, nullsafe `?->`, named arguments and union types. Flag ZFS flags newer than 2.0 (`zfs list -j`, `zpool status -j`) unless guarded, and webGUI files or globals missing on 6.9.2 or removed on 7.x (default-popup.css is gone from 7.x).
        - CSRF: do not re-validate. local_prepend.php checks the token and unsets it. The `X-CSRF-Token` header and `$csrf_token` global exist only on 7.3 and later, so never depend on them; send `csrf_token` in the POST body.
        - Commands go through runProcess() with an argument array and no shell. Flag string commands, exec, shell_exec, backticks. Passphrases go over stdin, never argv.
        - Validate every request value before use. Dataset and snapshot names follow OpenZFS: letters, digits, `-_.: ` and spaces are valid, so do not reject them.
        - Destructive actions (`zfs destroy`, rollback, `rm`, rename over): re-confine the realpath immediately before acting, stop at mount boundaries, enforce Destructive Mode on the server, and diff the guards across sibling branches.
        - A failed read is not an empty result. Empty pool, mount or in-use lists must block destructive work rather than allow it. Report failures to the UI; never report success on a non-zero exit.
        - getDatasetProperty() returns null for a failed read, and also for `-` on most properties (`mountpoint` and `keystatus` give 'none'). Where a failed read and `-` must lead to different actions (a resume token, a destroy), flag it unless the read checks its exit code.
        - "Inside a dataset" means equal to it, or starting with it plus `/` (`@` or `#` for its snapshots and bookmarks). Flag a bare string-prefix test: `tank/data2` is not inside `tank/data`.
        - Escape anything echoed into HTML or inline script. Config is saved to `/boot`, so saved values from older versions must keep working.
        - File names, ZFS user properties and anything from another server may not be valid UTF-8. htmlspecialchars() needs ENT_SUBSTITUTE, or it returns '' and the text disappears. json_encode() needs JSON_INVALID_UTF8_SUBSTITUTE, or its false result must be handled; never echo, publish or hash a json_encode() that can fail.
        - Every `zfs receive` takes `-s -u -o readonly=on` and never `-F`. A copy of a volume must not appear as a block device (volmode=none).
    - path: "zfs.master/{scripts/replica-serve.php,include/ZFSMReplicaServe.php}"
      instructions: |
        Reached by another server's SSH key (authorized_keys `command=`) and run as root. Treat everything from that server as hostile: SSH_ORIGINAL_COMMAND, the script's arguments, and the stream on stdin.
        - Trust nothing from the environment: PATH and the ZFSM_TEST_* hooks are reset before anything runs, and the docroot comes from the script's own path.
        - Each request runs one fixed zfs command, with no shell and no option taken from the request. Every name must be inside the sender's own area, `<accepting dataset>/<sender>/`; only `exists` may name the area itself.
        - zfs receive must not see a stream until its first record is checked: one dataset's stream only. Refuse a clone stream (DRR_FLAG_CLONE) and a -R or -p package. ZFS finds a clone's origin by guid anywhere in the pool, so a name check alone can't confine it.
        - Copies inherit the area's mountpoint=none, volmode=none and setuid, devices and exec off. The receive excludes those and the share properties with `-x`, and every request is refused once the area's properties change.
        - authorized_keys options apply left to right: a later `pty` or `*-forwarding` undoes `restrict`. This plugin's policy is that a replication key's `from=` lists exact IP addresses only, so a line whose `from=` holds a range, a wildcard, `!` or a host name is reported as not limited. Option names match whatever their case, and `command=` must be exactly the installed checker and a sender name.
    - path: "zfs.master/frontend/**/*.js"
      instructions: |
        Runs on Unraid's shared Main tab next to other plugins.
        - Dataset, snapshot and directory names are user-controlled, and directories can contain any character. They must go through escapeHtml, or the encoded handler helper for inline onclick. Never use them raw as a CSS class or id: a pool named `red` collides with Unraid's theme classes.
        - No global $.ajaxSetup or other page-wide changes. A bare same-origin $.post is fine because the webGUI prefilter adds the token. Popups (openBox iframes) must send csrf_token in the POST body.
        - Treat 0 as a valid value (refresh interval, counts). Timers and in-flight requests must stop on pagehide and must not overlap.
    - path: "zfs.master.plg"
      instructions: |
        Install manifest, run as root. No removepkg outside Method="remove". A failed download must leave the running install intact. The script must be safe on upgrade from older versions that unpacked a tar with no package record. CI already validates XML and the changelog render, so do not flag version, md5 or CHANGES values, which the release flow owns.
    - path: "tests/**"
      instructions: |
        Tests use fake zfs and zpool binaries and must never run real ZFS commands. Flag a test that stubs the code it claims to check. Tests also run on PHP 7.4.
    - path: ".github/workflows/**"
      instructions: |
        Pin third-party actions by commit SHA. Least-privilege permissions. Untrusted PR data must not reach `run:` via `${{ }}` interpolation.
  tools:
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    markdownlint:
      enabled: false
chat:
  auto_reply: true
